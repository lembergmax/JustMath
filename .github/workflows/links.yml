# Checks the links of the Markdown documents, including the links to other sites. The relative links are also checked by
# MarkdownLinksTest in every build; this workflow adds the network. It does not belong to the required checks: a site that
# is down must not block a merge.
name: Links

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/links.yml'
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check the links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the links
        # The compare link of an unreleased version does not exist before its tag does.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --retry-wait-time 5 --timeout 20 --accept 200,206,429 --exclude-path docs/units.md --exclude 'compare/1.6.0...1.7.0$' './**/*.md'
          fail: true
