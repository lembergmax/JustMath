# Continuous integration: builds and runs the full test suite on every pull request and on pushes to
# the long-lived branches. This catches breakage on `developer` / feature branches and in PRs BEFORE
# code reaches `main` (where publish.yml would otherwise be the first place tests run).
name: CI

on:
  pull_request:
  push:
    branches: [main, developer]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '23']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B --no-transfer-progress verify
