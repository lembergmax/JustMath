# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main", "remake" ]
  pull_request:
    branches: [ "main", "remake" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # mvnw ist im Repository nicht als ausführbar markiert
    - name: Make Maven Wrapper executable
      run: chmod +x mvnw

    # Ab JDK 23 laufen Annotation Processors (Lombok) nur noch, wenn sie explizit aktiviert sind
    - name: Build with Maven
      run: ./mvnw -B package -DskipTests --file pom.xml -Dmaven.compiler.proc=full

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: JustMath-jar
        path: target/*.jar
        retention-days: 14

  test:

    # Läuft nur, wenn der Build erfolgreich war
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # mvnw ist im Repository nicht als ausführbar markiert
    - name: Make Maven Wrapper executable
      run: chmod +x mvnw

    # Jeder Job läuft auf einer frischen Maschine, daher wird hier erneut kompiliert
    - name: Test with Maven
      run: ./mvnw -B test --file pom.xml -Dmaven.compiler.proc=full

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: target/surefire-reports/
        retention-days: 7