# Runs PIT mutation tests once a week and on demand, and fails when the mutation score drops below the threshold
# in pom.xml (pit.mutation.threshold). A mutation run takes far longer than a build, so it does not run on pull
# requests. See docs/mutation-testing.md for what the score means and how to raise the threshold.
name: Mutation tests

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pitest:
    name: PIT mutation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run PIT
        run: ./mvnw -B --no-transfer-progress -Djacoco.skip=true test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Summarize the mutation score
        if: always()
        run: |
          report=target/pit-reports/mutations.xml
          if [ ! -f "$report" ]; then
            echo "No PIT report was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count() { grep -c "status='$1'" "$report" || true; }
          killed=$(count KILLED)
          timed_out=$(count TIMED_OUT)
          errors=$(( $(count MEMORY_ERROR) + $(count RUN_ERROR) ))
          survived=$(count SURVIVED)
          no_coverage=$(count NO_COVERAGE)
          detected=$((killed + timed_out + errors))
          total=$((detected + survived + no_coverage))
          if [ "$total" -gt 0 ]; then
            score=$((100 * detected / total))
          else
            score=0
          fi
          {
            echo "### Mutation score: ${score} %"
            echo ""
            echo "| Killed | Timed out | Memory or run error | Survived | No coverage | Total |"
            echo "| ---: | ---: | ---: | ---: | ---: | ---: |"
            echo "| ${killed} | ${timed_out} | ${errors} | ${survived} | ${no_coverage} | ${total} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the PIT report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pit-reports
          path: target/pit-reports
          if-no-files-found: ignore
          retention-days: 30
