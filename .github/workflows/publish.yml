# Publishes JustMath to Maven Central after the maintainer approves it, then creates the tag and the GitHub release.
#
# A release on Maven Central cannot be removed, so nothing is published by a merge alone. The job "publish" belongs
# to the GitHub environment "maven-central", which lists the maintainer as required reviewer (Settings ->
# Environments). The run stops at that job until the reviewer approves it. docs/releasing.md describes the whole
# procedure.
#
# Triggers: a push to main (the merge of the release pull request) and a manual run. A version that is already on
# Maven Central is detected and skipped, so a push to main without a new <version> in pom.xml does nothing.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   CENTRAL_USERNAME   Sonatype Central Portal user-token name code
#   CENTRAL_PASSWORD   Sonatype Central Portal user-token secret
#   GPG_PRIVATE_KEY    ASCII-armored secret key, including the BEGIN and END lines
#   GPG_PASSPHRASE     passphrase of GPG_PRIVATE_KEY

name: Publish to Maven Central

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the release files and read the release notes, but publish nothing'
        type: boolean
        default: false

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pom.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Read the project version
        id: pom
        run: |
          version=$(./mvnw -q -B --no-transfer-progress -DforceStdout help:evaluate -Dexpression=project.version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Project version: $version"

      - name: Reject SNAPSHOT versions
        run: |
          version="${{ steps.pom.outputs.version }}"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::SNAPSHOT versions are not deployable with this workflow ($version)."
            exit 1
          fi

      - name: Skip a version that is already on Maven Central
        id: gate
        run: |
          version="${{ steps.pom.outputs.version }}"
          url="https://repo1.maven.org/maven2/io/github/lembergmax/justmath/$version/justmath-$version.pom"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "GET $url -> HTTP $status"
          if [[ "$status" == "200" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::io.github.lembergmax:justmath:$version is already on Maven Central, nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build, sign and deploy to Central
    needs: plan
    if: needs.plan.outputs.publish == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: maven-central
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21, import the GPG key and write settings.xml
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Test, sign and deploy
        run: ./mvnw -P release -B --no-transfer-progress clean deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Collect the release files and compute the checksums
        run: |
          version="${{ needs.plan.outputs.version }}"
          mkdir release-assets
          cp "target/justmath-$version.jar" "target/justmath-$version-sources.jar" "target/justmath-$version-javadoc.jar" release-assets/
          cp target/justmath-"$version"*.jar.asc release-assets/
          cp "target/justmath-$version-cyclonedx.json" release-assets/
          (cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Attest the build provenance of the jars
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/justmath-*.jar

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 14

      - name: Report the deployment
        run: |
          {
            echo "### Deployment submitted"
            echo ""
            echo "- groupId: \`io.github.lembergmax\`"
            echo "- artifactId: \`justmath\`"
            echo "- version: \`${{ needs.plan.outputs.version }}\`"
            echo ""
            echo "Central validated the bundle and releases it on its own. The index at repo1.maven.org"
            echo "needs up to 30 minutes. The next job waits for it and then creates the GitHub release."
          } >> "$GITHUB_STEP_SUMMARY"

  rehearsal:
    name: Rehearse the release without publishing
    needs: plan
    if: inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Collect the release files and compute the checksums
        run: |
          version="${{ needs.plan.outputs.version }}"
          mkdir release-assets
          cp "target/justmath-$version.jar" "target/justmath-$version-sources.jar" "target/justmath-$version-javadoc.jar" release-assets/
          cp "target/justmath-$version-cyclonedx.json" release-assets/
          (cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Read the release notes from CHANGELOG.md
        run: |
          version="${{ needs.plan.outputs.version }}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          cat release-notes.md

  release:
    name: Create the tag and the GitHub release
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Wait until the version is on Maven Central
        run: |
          version="${{ needs.plan.outputs.version }}"
          url="https://repo1.maven.org/maven2/io/github/lembergmax/justmath/$version/justmath-$version.jar"
          for attempt in $(seq 1 90); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "Attempt $attempt: HTTP $status"
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 60
          done
          echo "::error::$url did not appear within 90 minutes."
          exit 1

      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${{ needs.plan.outputs.version }}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.plan.outputs.version }}"
          if gh release view "$version" > /dev/null 2>&1; then
            gh release upload "$version" release-assets/* --clobber
          else
            gh release create "$version" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "JustMath $version" \
              --notes-file release-notes.md
          fi
