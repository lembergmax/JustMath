error.syntax.invalidCharacter=Caractère non valide '{character}' à la position {position}.
error.syntax.missingRightParen=Parenthèse fermante manquante pour la fonction '{function}'.
error.syntax.unmatchedParen=Parenthèses non appariées dans l'expression.
error.syntax.unknownFunction=Fonction ou opérateur inconnu '{function}'.
error.syntax.unknownVariable=La variable '{variable}' n'est pas définie.
error.syntax.incompleteExpression=L'expression est incomplète ou les barres de valeur absolue sont déséquilibrées.
error.syntax.wrongArgumentCount=La fonction '{function}' attend {expected} arguments.
error.syntax.misplacedSeparator=Séparateur ';' mal placé dans l'expression.
error.syntax.invalidFactorial=La factorielle '!' doit suivre un nombre, une constante, une variable ou une parenthèse fermante.
error.processing.divisionByZero=La division par zéro n'est pas autorisée.
error.processing.domainError=La valeur est en dehors du domaine autorisé pour cette opération.
error.processing.internal=L'expression n'a pas pu être traitée.
error.syntax.trailingOperator=L'expression se termine par l'opérateur '{operator}' mais il manque son opérande de droite.
error.syntax.missingOperand=Il manque un opérande à l'opérateur ou à la fonction '{operator}'.
error.syntax.emptyFunctionArgument=La fonction '{function}' a été appelée sans argument.
error.syntax.leadingOperator=L'expression commence par l'opérateur '{operator}' mais il manque son opérande de gauche.
error.syntax.emptyParentheses=Paire de parenthèses vide '()' sans contenu.
error.syntax.missingOperator=Deux opérandes ne sont pas reliés par un opérateur.
error.syntax.unexpectedEnd=L'expression est incomplète : des opérandes sans opérateur de liaison.
error.argument.countMismatch=La fonction '{function}' attend {expected} arguments mais en a reçu {actual}.
error.math.factorialNegative=La factorielle n'est pas définie pour les nombres négatifs.
error.math.factorialNonInteger=La factorielle n'est définie que pour les entiers.
error.math.logNonPositive=Le logarithme n'est pas défini pour les arguments négatifs ou nuls.
error.math.rootOfNegative=La racine paire d'un nombre négatif n'est pas un nombre réel.
error.math.overflow=Le résultat est trop grand pour être calculé.
error.category.syntax=Erreur de syntaxe
error.category.math=Erreur mathématique
error.category.argument=Erreur d'argument
error.category.stack=Erreur de pile
error.category.range=Erreur de plage
error.category.dimension=Erreur de dimension
error.category.internal=L'expression n'a pas pu être traitée.
error.generic=L'expression n'a pas pu être évaluée.
