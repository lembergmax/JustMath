# --- Konstruktion / Parsing ---
matrix.error.invalidDimensions=Matrixdimensionen müssen nicht-negative ganze Zahlen sein.
matrix.error.tooLarge=Matrixgröße muss kleiner als Integer.MAX_VALUE sein.
matrix.error.stringEmpty=Matrix-Zeichenkette darf nicht leer sein.
matrix.error.stringEdgeSeparator=Matrix-Einträge dürfen nicht mit ';' oder ',' beginnen oder enden.
matrix.error.columnCountMismatch=Alle Zeilen müssen die gleiche Spaltenanzahl haben (erhalten {actual}, erwartet {expected}).
matrix.error.entryEmpty=Matrix-Eintrag darf nicht leer sein.
matrix.error.invalidEntry=Ungültiger Matrix-Eintrag '{entry}' für Locale {locale}.
matrix.error.dataEmpty=Matrix-Daten müssen mindestens eine Zeile enthalten.
matrix.error.rowEmpty=Matrix-Zeilen müssen mindestens eine Spalte enthalten.
matrix.error.raggedRow=Alle Zeilen müssen die gleiche Spaltenanzahl haben (Zeile {row} hat {actual} Einträge, erwartet {expected}).

# --- Index-Prüfung ---
matrix.error.rowIndexOutOfBounds=Zeilenindex außerhalb des gültigen Bereichs: {index}
matrix.error.columnIndexOutOfBounds=Spaltenindex außerhalb des gültigen Bereichs: {index}

# --- Quadratische Vorbedingungen ---
matrix.error.notSquareDeterminant=Determinante ist nur für quadratische Matrizen definiert.
matrix.error.notSquareInverse=Nur quadratische Matrizen können invertiert werden.
matrix.error.notSquarePower=Matrixpotenz ist nur für quadratische Matrizen definiert.
matrix.error.notSquareTrace=Spur ist nur für quadratische Matrizen definiert.

# --- Algebraische Operationen ---
matrix.error.multiplyDimMismatch=Matrixmultiplikation – Dimensionsfehler: linke Matrix ist {leftRows}x{leftCols}, rechte Matrix ist {rightRows}x{rightCols}. Die Spaltenanzahl der linken Matrix muss der Zeilenanzahl der rechten Matrix entsprechen.
matrix.error.elementWiseDimMismatch=Elementweise Matrixoperation – Dimensionsfehler: linke Matrix ist {leftRows}x{leftCols}, rechte Matrix ist {rightRows}x{rightCols}. Beide Matrizen müssen identische Dimensionen haben.
matrix.error.zeroDim=Matrixdimensionen müssen größer als Null sein.
matrix.error.singular=Matrix ist nicht invertierbar (Determinante ist Null).
matrix.error.invalidExponent=Matrix-Exponent muss eine nicht-negative ganze Zahl sein.
