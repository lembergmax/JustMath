matrix.error.invalidDimensions=Les dimensions de la matrice doivent être des entiers non négatifs.
matrix.error.tooLarge=La taille de la matrice doit être inférieure à Integer.MAX_VALUE.
matrix.error.stringEmpty=La chaîne de la matrice ne doit pas être vide.
matrix.error.stringEdgeSeparator=Les entrées de la matrice ne doivent pas commencer ou se terminer par ';' ou ','.
matrix.error.columnCountMismatch=Toutes les lignes doivent avoir le même nombre de colonnes (obtenu {actual}, attendu {expected}).
matrix.error.entryEmpty=Une entrée de la matrice ne doit pas être vide.
matrix.error.invalidEntry=Entrée de matrice non valide '{entry}' pour la locale {locale}.
matrix.error.dataEmpty=Les données de la matrice doivent contenir au moins une ligne.
matrix.error.rowEmpty=Les lignes de la matrice doivent contenir au moins une colonne.
matrix.error.raggedRow=Toutes les lignes doivent avoir le même nombre de colonnes (la ligne {row} a {actual} entrées, attendu {expected}).
matrix.error.rowIndexOutOfBounds=indice de ligne hors limites : {index}
matrix.error.columnIndexOutOfBounds=indice de colonne hors limites : {index}
matrix.error.notSquareDeterminant=Le déterminant n'est défini que pour les matrices carrées.
matrix.error.notSquareInverse=Seules les matrices carrées peuvent être inversées.
matrix.error.notSquarePower=La puissance d'une matrice n'est définie que pour les matrices carrées.
matrix.error.notSquareTrace=La trace n'est définie que pour les matrices carrées.
matrix.error.multiplyDimMismatch=Incompatibilité de dimensions pour la multiplication de matrices : la matrice de gauche est {leftRows}x{leftCols}, la matrice de droite est {rightRows}x{rightCols}. Le nombre de colonnes de gauche doit égaler le nombre de lignes de droite.
matrix.error.elementWiseDimMismatch=Incompatibilité de dimensions pour l'opération élément par élément : la matrice de gauche est {leftRows}x{leftCols}, la matrice de droite est {rightRows}x{rightCols}. Les deux matrices doivent avoir des dimensions identiques.
matrix.error.zeroDim=Les dimensions de la matrice doivent être supérieures à zéro.
matrix.error.singular=La matrice n'est pas inversible (le déterminant est nul).
matrix.error.invalidExponent=L'exposant de la matrice doit être un entier non négatif.
