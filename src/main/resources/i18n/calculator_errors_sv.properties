error.math.factorialNonInteger=Fakulteten är endast definierad för heltal.
error.math.logNonPositive=Logaritmen är inte definierad för icke-positiva argument.
error.math.rootOfNegative=Jämn rot av ett negativt tal är inte ett reellt tal.
error.math.overflow=Resultatet är för stort för att beräknas.
