error.processing.divisionByZero=Division med noll är inte tillåten.
error.processing.domainError=Värdet ligger utanför det tillåtna definitionsområdet för denna operation.
error.processing.internal=Uttrycket kunde inte bearbetas.
error.syntax.trailingOperator=Uttrycket slutar med operatorn '{operator}' men saknar sin högra operand.
error.syntax.missingOperand=Operatorn eller funktionen '{operator}' saknar en operand.
error.syntax.emptyFunctionArgument=Funktionen '{function}' anropades utan argument.
error.syntax.leadingOperator=Uttrycket börjar med operatorn '{operator}' men saknar sin vänstra operand.
error.syntax.emptyParentheses=Tomt parentespar '()' utan innehåll.
error.syntax.missingOperator=Två operander är inte sammanbundna av en operator.
error.syntax.unexpectedEnd=Uttrycket är ofullständigt: operander utan en sammanbindande operator.
error.argument.countMismatch=Funktionen '{function}' förväntar sig {expected} argument men fick {actual}.
