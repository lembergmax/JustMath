error.syntax.invalidCharacter=Ogiltigt tecken '{character}' på position {position}.
error.syntax.missingRightParen=Saknad högerparentes för funktionen '{function}'.
error.syntax.unmatchedParen=Obalanserade parenteser i uttrycket.
error.syntax.unknownFunction=Okänd funktion eller operator '{function}'.
error.syntax.unknownVariable=Variabeln '{variable}' är inte definierad.
error.syntax.incompleteExpression=Uttrycket är ofullständigt eller så är absolutbeloppsstrecken obalanserade.
error.syntax.wrongArgumentCount=Funktionen '{function}' förväntar sig {expected} argument.
error.syntax.misplacedSeparator=Felplacerad avgränsare ';' i uttrycket.
