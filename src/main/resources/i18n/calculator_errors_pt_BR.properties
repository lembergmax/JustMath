error.syntax.invalidCharacter=Caractere inválido '{character}' na posição {position}.
error.syntax.missingRightParen=Parêntese de fechamento ausente para a função '{function}'.
error.syntax.unmatchedParen=Parênteses não correspondentes na expressão.
error.syntax.unknownFunction=Função ou operador desconhecido '{function}'.
error.syntax.unknownVariable=A variável '{variable}' não está definida.
error.syntax.incompleteExpression=A expressão está incompleta ou as barras de valor absoluto estão desbalanceadas.
error.syntax.wrongArgumentCount=A função '{function}' espera {expected} argumentos.
error.syntax.misplacedSeparator=Separador ';' mal colocado na expressão.
error.syntax.invalidFactorial=O fatorial '!' deve vir após um número, constante, variável ou parêntese de fechamento.
error.processing.divisionByZero=A divisão por zero não é permitida.
error.processing.domainError=O valor está fora do domínio permitido para esta operação.
error.processing.internal=Não foi possível processar a expressão.
error.syntax.trailingOperator=A expressão termina com o operador '{operator}' mas falta o operando à direita.
error.syntax.missingOperand=Falta um operando ao operador ou função '{operator}'.
error.syntax.emptyFunctionArgument=A função '{function}' foi chamada sem argumentos.
error.syntax.leadingOperator=A expressão começa com o operador '{operator}' mas falta o operando à esquerda.
error.syntax.emptyParentheses=Par de parênteses vazio '()' sem conteúdo.
error.syntax.missingOperator=Dois operandos não estão conectados por um operador.
error.syntax.unexpectedEnd=A expressão está incompleta: operandos sem um operador de conexão.
error.argument.countMismatch=A função '{function}' espera {expected} argumentos mas recebeu {actual}.
error.math.factorialNegative=O fatorial não está definido para números negativos.
error.math.factorialNonInteger=O fatorial só está definido para números inteiros.
error.math.logNonPositive=O logaritmo não está definido para argumentos não positivos.
error.math.rootOfNegative=A raiz par de um número negativo não é um número real.
error.math.overflow=O resultado é grande demais para ser calculado.
error.category.syntax=Erro de sintaxe
error.category.math=Erro matemático
error.category.argument=Erro de argumento
error.category.stack=Erro de pilha
error.category.range=Erro de intervalo
error.category.dimension=Erro de dimensão
error.category.internal=Não foi possível processar a expressão.
error.generic=Não foi possível avaliar a expressão.
