error.syntax.invalidCharacter=Neplatný znak '{character}' na pozici {position}.
error.syntax.missingRightParen=Chybí uzavírací závorka pro funkci '{function}'.
error.syntax.unmatchedParen=Neodpovídající závorky ve výrazu.
error.syntax.unknownFunction=Neznámá funkce nebo operátor '{function}'.
error.syntax.unknownVariable=Proměnná '{variable}' není definována.
error.syntax.incompleteExpression=Výraz je neúplný nebo jsou neuzavřené svislé čáry absolutní hodnoty.
error.syntax.wrongArgumentCount=Funkce '{function}' očekává {expected} argumentů.
error.syntax.misplacedSeparator=Nesprávně umístěný oddělovač ';' ve výrazu.
error.syntax.invalidFactorial=Faktoriál '!' musí následovat po čísle, konstantě, proměnné nebo uzavírací závorce.
error.processing.divisionByZero=Dělení nulou není povoleno.
error.processing.domainError=Hodnota je mimo povolený definiční obor pro tuto operaci.
error.processing.internal=Výraz nelze zpracovat.
error.syntax.trailingOperator=Výraz končí operátorem '{operator}', ale chybí jeho pravý operand.
error.syntax.missingOperand=Operátoru nebo funkci '{operator}' chybí operand.
error.syntax.emptyFunctionArgument=Funkce '{function}' byla zavolána bez argumentu.
error.syntax.leadingOperator=Výraz začíná operátorem '{operator}', ale chybí jeho levý operand.
error.syntax.emptyParentheses=Prázdná dvojice závorek '()' bez obsahu.
error.syntax.missingOperator=Dva operandy nejsou spojeny operátorem.
error.syntax.unexpectedEnd=Výraz je neúplný: operandy bez spojujícího operátoru.
error.argument.countMismatch=Funkce '{function}' očekává {expected} argumentů, ale obdržela {actual}.
error.math.factorialNegative=Faktoriál není definován pro záporná čísla.
error.math.factorialNonInteger=Faktoriál je definován pouze pro celá čísla.
error.math.logNonPositive=Logaritmus není definován pro nekladné argumenty.
error.math.rootOfNegative=Sudá odmocnina ze záporného čísla není reálné číslo.
error.math.overflow=Výsledek je příliš velký na výpočet.
error.category.syntax=Syntaktická chyba
error.category.math=Matematická chyba
error.category.argument=Chyba argumentu
error.category.stack=Chyba zásobníku
error.category.range=Chyba rozsahu
error.category.dimension=Chyba rozměru
