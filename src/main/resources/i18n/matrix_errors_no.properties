matrix.error.elementWiseDimMismatch=Dimensjonsuoverensstemmelse ved elementvis matriseoperasjon: venstre matrise er {leftRows}x{leftCols}, høyre matrise er {rightRows}x{rightCols}. Begge matrisene må ha identiske dimensjoner.
matrix.error.zeroDim=Matrisedimensjoner må være større enn null.
