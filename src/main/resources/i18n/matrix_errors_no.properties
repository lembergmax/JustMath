matrix.error.rowIndexOutOfBounds=radindeks utenfor området: {index}
matrix.error.columnIndexOutOfBounds=kolonneindeks utenfor området: {index}
matrix.error.notSquareDeterminant=Determinanten er bare definert for kvadratiske matriser.
