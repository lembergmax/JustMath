matrix.error.invalidDimensions=Wymiary macierzy muszą być nieujemnymi liczbami całkowitymi.
matrix.error.tooLarge=Rozmiar macierzy musi być mniejszy niż Integer.MAX_VALUE.
matrix.error.stringEmpty=Ciąg znaków macierzy nie może być pusty.
matrix.error.stringEdgeSeparator=Wpisy macierzy nie mogą zaczynać się ani kończyć znakiem ';' lub ','.
matrix.error.columnCountMismatch=Wszystkie wiersze muszą mieć tę samą liczbę kolumn (otrzymano {actual}, oczekiwano {expected}).
matrix.error.entryEmpty=Wpis macierzy nie może być pusty.
matrix.error.invalidEntry=Nieprawidłowy wpis macierzy '{entry}' dla ustawień regionalnych {locale}.
matrix.error.dataEmpty=Dane macierzy muszą zawierać co najmniej jeden wiersz.
matrix.error.rowEmpty=Wiersze macierzy muszą zawierać co najmniej jedną kolumnę.
matrix.error.raggedRow=Wszystkie wiersze muszą mieć tę samą liczbę kolumn (wiersz {row} ma {actual} wpisów, oczekiwano {expected}).
matrix.error.rowIndexOutOfBounds=indeks wiersza poza zakresem: {index}
matrix.error.columnIndexOutOfBounds=indeks kolumny poza zakresem: {index}
matrix.error.notSquareDeterminant=Wyznacznik jest zdefiniowany tylko dla macierzy kwadratowych.
matrix.error.notSquareInverse=Tylko macierze kwadratowe mogą być odwracane.
matrix.error.notSquarePower=Potęga macierzy jest zdefiniowana tylko dla macierzy kwadratowych.
matrix.error.notSquareTrace=Ślad jest zdefiniowany tylko dla macierzy kwadratowych.
matrix.error.multiplyDimMismatch=Niezgodność wymiarów przy mnożeniu macierzy: lewa macierz to {leftRows}x{leftCols}, prawa macierz to {rightRows}x{rightCols}. Liczba kolumn lewej macierzy musi być równa liczbie wierszy prawej macierzy.
matrix.error.elementWiseDimMismatch=Niezgodność wymiarów przy operacji element po elemencie: lewa macierz to {leftRows}x{leftCols}, prawa macierz to {rightRows}x{rightCols}. Obie macierze muszą mieć identyczne wymiary.
matrix.error.zeroDim=Wymiary macierzy muszą być większe od zera.
matrix.error.singular=Macierz jest nieodwracalna (wyznacznik wynosi zero).
matrix.error.invalidExponent=Wykładnik macierzy musi być nieujemną liczbą całkowitą.
