error.syntax.invalidCharacter=Nieprawidłowy znak '{character}' na pozycji {position}.
error.syntax.missingRightParen=Brak nawiasu zamykającego dla funkcji '{function}'.
error.syntax.unmatchedParen=Niesparowane nawiasy w wyrażeniu.
error.syntax.unknownFunction=Nieznana funkcja lub operator '{function}'.
error.syntax.unknownVariable=Zmienna '{variable}' nie jest zdefiniowana.
error.syntax.incompleteExpression=Wyrażenie jest niekompletne lub kreski wartości bezwzględnej są niezrównoważone.
error.syntax.wrongArgumentCount=Funkcja '{function}' oczekuje {expected} argumentów.
error.syntax.misplacedSeparator=Nieprawidłowo umieszczony separator ';' w wyrażeniu.
error.syntax.invalidFactorial=Silnia '!' musi następować po liczbie, stałej, zmiennej lub nawiasie zamykającym.
error.processing.divisionByZero=Dzielenie przez zero jest niedozwolone.
error.processing.domainError=Wartość jest poza dozwoloną dziedziną dla tej operacji.
error.processing.internal=Nie można przetworzyć wyrażenia.
error.syntax.trailingOperator=Wyrażenie kończy się operatorem '{operator}', ale brakuje jego prawego operandu.
error.syntax.missingOperand=Operatorowi lub funkcji '{operator}' brakuje operandu.
error.syntax.emptyFunctionArgument=Funkcja '{function}' została wywołana bez argumentu.
error.syntax.leadingOperator=Wyrażenie zaczyna się operatorem '{operator}', ale brakuje jego lewego operandu.
error.syntax.emptyParentheses=Pusta para nawiasów '()' bez zawartości.
error.syntax.missingOperator=Dwa operandy nie są połączone operatorem.
error.syntax.unexpectedEnd=Wyrażenie jest niekompletne: operandy bez łączącego operatora.
error.argument.countMismatch=Funkcja '{function}' oczekuje {expected} argumentów, ale otrzymała {actual}.
error.math.factorialNegative=Silnia nie jest zdefiniowana dla liczb ujemnych.
error.math.factorialNonInteger=Silnia jest zdefiniowana tylko dla liczb całkowitych.
error.math.logNonPositive=Logarytm nie jest zdefiniowany dla argumentów niedodatnich.
error.math.rootOfNegative=Pierwiastek parzysty z liczby ujemnej nie jest liczbą rzeczywistą.
error.math.overflow=Wynik jest zbyt duży, aby go obliczyć.
error.category.syntax=Błąd składni
error.category.math=Błąd matematyczny
error.category.argument=Błąd argumentu
error.category.stack=Błąd stosu
error.category.range=Błąd zakresu
error.category.dimension=Błąd wymiaru
error.category.internal=Nie można przetworzyć wyrażenia.
error.generic=Nie można obliczyć wyrażenia.
