error.syntax.unmatchedParen=Klammern im Ausdruck stimmen nicht überein.
error.syntax.unknownFunction=Unbekannte Funktion oder unbekannter Operator '{function}'.
error.syntax.unknownVariable=Variable '{variable}' ist nicht definiert.
