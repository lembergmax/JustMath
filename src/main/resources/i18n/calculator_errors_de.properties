error.processing.divisionByZero=Division durch Null ist nicht erlaubt.
error.processing.domainError=Wert liegt außerhalb des zulässigen Bereichs für diese Operation.
error.processing.internal=Der Ausdruck konnte nicht verarbeitet werden.
