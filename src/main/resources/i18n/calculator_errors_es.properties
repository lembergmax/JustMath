error.syntax.invalidCharacter=Carácter no válido '{character}' en la posición {position}.
error.syntax.missingRightParen=Falta el paréntesis de cierre para la función '{function}'.
error.syntax.unmatchedParen=Paréntesis no balanceados en la expresión.
error.syntax.unknownFunction=Función u operador desconocido '{function}'.
error.syntax.unknownVariable=La variable '{variable}' no está definida.
error.syntax.incompleteExpression=La expresión está incompleta o las barras de valor absoluto están desequilibradas.
error.syntax.wrongArgumentCount=La función '{function}' espera {expected} argumentos.
error.syntax.misplacedSeparator=Separador ';' mal colocado en la expresión.
error.syntax.invalidFactorial=El factorial '!' debe ir después de un número, una constante, una variable o un paréntesis de cierre.
error.processing.divisionByZero=No se permite la división por cero.
error.processing.domainError=El valor está fuera del dominio permitido para esta operación.
error.processing.internal=No se pudo procesar la expresión.
error.syntax.trailingOperator=La expresión termina con el operador '{operator}' pero le falta su operando derecho.
error.syntax.missingOperand=Al operador o a la función '{operator}' le falta un operando.
error.syntax.emptyFunctionArgument=La función '{function}' se llamó sin argumentos.
error.syntax.leadingOperator=La expresión comienza con el operador '{operator}' pero le falta su operando izquierdo.
error.syntax.emptyParentheses=Par de paréntesis vacío '()' sin contenido.
error.syntax.missingOperator=Dos operandos no están conectados por un operador.
error.syntax.unexpectedEnd=La expresión está incompleta: operandos sin un operador que los conecte.
error.argument.countMismatch=La función '{function}' espera {expected} argumentos pero recibió {actual}.
error.math.factorialNegative=El factorial no está definido para números negativos.
error.math.factorialNonInteger=El factorial solo está definido para números enteros.
error.math.logNonPositive=El logaritmo no está definido para argumentos no positivos.
error.math.rootOfNegative=La raíz par de un número negativo no es un número real.
error.math.overflow=El resultado es demasiado grande para calcularlo.
error.category.syntax=Error de sintaxis
error.category.math=Error matemático
error.category.argument=Error de argumento
error.category.stack=Error de pila
error.category.range=Error de rango
error.category.dimension=Error de dimensión
error.category.internal=No se pudo procesar la expresión.
error.generic=No se pudo evaluar la expresión.
