matrix.error.invalidDimensions=As dimensões da matriz devem ser números inteiros não negativos.
matrix.error.tooLarge=O tamanho da matriz deve ser inferior a Integer.MAX_VALUE.
matrix.error.stringEmpty=A cadeia de caracteres da matriz não pode estar vazia.
matrix.error.stringEdgeSeparator=As entradas da matriz não podem começar nem terminar com ';' ou ','.
matrix.error.columnCountMismatch=Todas as linhas devem ter o mesmo número de colunas (obtido {actual}, esperado {expected}).
matrix.error.entryEmpty=Uma entrada da matriz não pode estar vazia.
matrix.error.invalidEntry=Entrada de matriz inválida '{entry}' para a configuração regional {locale}.
matrix.error.dataEmpty=Os dados da matriz devem conter pelo menos uma linha.
matrix.error.rowEmpty=As linhas da matriz devem conter pelo menos uma coluna.
matrix.error.raggedRow=Todas as linhas devem ter o mesmo número de colunas (a linha {row} tem {actual} entradas, esperado {expected}).
matrix.error.rowIndexOutOfBounds=índice de linha fora dos limites: {index}
matrix.error.columnIndexOutOfBounds=índice de coluna fora dos limites: {index}
matrix.error.notSquareDeterminant=O determinante só está definido para matrizes quadradas.
matrix.error.notSquareInverse=Apenas as matrizes quadradas podem ser invertidas.
matrix.error.notSquarePower=A potência de uma matriz só está definida para matrizes quadradas.
matrix.error.notSquareTrace=O traço só está definido para matrizes quadradas.
matrix.error.multiplyDimMismatch=Incompatibilidade de dimensões na multiplicação de matrizes: a matriz esquerda é {leftRows}x{leftCols}, a matriz direita é {rightRows}x{rightCols}. As colunas da esquerda devem ser iguais às linhas da direita.
matrix.error.elementWiseDimMismatch=Incompatibilidade de dimensões na operação elemento a elemento: a matriz esquerda é {leftRows}x{leftCols}, a matriz direita é {rightRows}x{rightCols}. Ambas as matrizes devem ter dimensões idênticas.
matrix.error.zeroDim=As dimensões da matriz devem ser maiores que zero.
matrix.error.singular=A matriz não é invertível (o determinante é zero).
matrix.error.invalidExponent=O expoente da matriz deve ser um número inteiro não negativo.
