matrix.error.invalidDimensions=Le dimensioni della matrice devono essere numeri interi non negativi.
matrix.error.tooLarge=La dimensione della matrice deve essere inferiore a Integer.MAX_VALUE.
matrix.error.stringEmpty=La stringa della matrice non deve essere vuota.
matrix.error.stringEdgeSeparator=Le voci della matrice non devono iniziare o terminare con ';' o ','.
matrix.error.columnCountMismatch=Tutte le righe devono avere lo stesso numero di colonne (ottenuto {actual}, atteso {expected}).
matrix.error.entryEmpty=Una voce della matrice non deve essere vuota.
matrix.error.invalidEntry=Voce della matrice non valida '{entry}' per la locale {locale}.
matrix.error.dataEmpty=I dati della matrice devono contenere almeno una riga.
matrix.error.rowEmpty=Le righe della matrice devono contenere almeno una colonna.
matrix.error.raggedRow=Tutte le righe devono avere lo stesso numero di colonne (la riga {row} ha {actual} voci, atteso {expected}).
matrix.error.rowIndexOutOfBounds=indice di riga fuori dai limiti: {index}
matrix.error.columnIndexOutOfBounds=indice di colonna fuori dai limiti: {index}
matrix.error.notSquareDeterminant=Il determinante è definito solo per le matrici quadrate.
matrix.error.notSquareInverse=Solo le matrici quadrate possono essere invertite.
matrix.error.notSquarePower=La potenza di una matrice è definita solo per le matrici quadrate.
matrix.error.notSquareTrace=La traccia è definita solo per le matrici quadrate.
matrix.error.multiplyDimMismatch=Incompatibilità di dimensioni nella moltiplicazione di matrici: la matrice sinistra è {leftRows}x{leftCols}, la matrice destra è {rightRows}x{rightCols}. Le colonne di sinistra devono essere uguali alle righe di destra.
matrix.error.elementWiseDimMismatch=Incompatibilità di dimensioni nell'operazione elemento per elemento: la matrice sinistra è {leftRows}x{leftCols}, la matrice destra è {rightRows}x{rightCols}. Entrambe le matrici devono avere dimensioni identiche.
matrix.error.zeroDim=Le dimensioni della matrice devono essere maggiori di zero.
matrix.error.singular=La matrice non è invertibile (il determinante è zero).
matrix.error.invalidExponent=L'esponente della matrice deve essere un numero intero non negativo.
