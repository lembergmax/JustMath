error.syntax.invalidCharacter=Ugyldigt tegn '{character}' på position {position}.
error.syntax.missingRightParen=Manglende slutparentes for funktionen '{function}'.
error.syntax.unmatchedParen=Uafbalancerede parenteser i udtrykket.
error.syntax.unknownFunction=Ukendt funktion eller operator '{function}'.
error.syntax.unknownVariable=Variablen '{variable}' er ikke defineret.
error.syntax.incompleteExpression=Udtrykket er ufuldstændigt, eller stregerne for numerisk værdi er ikke afbalancerede.
error.syntax.wrongArgumentCount=Funktionen '{function}' forventer {expected} argumenter.
error.syntax.misplacedSeparator=Forkert placeret separator ';' i udtrykket.
error.syntax.invalidFactorial=Fakultet '!' skal følge efter et tal, en konstant, en variabel eller en slutparentes.
error.processing.divisionByZero=Division med nul er ikke tilladt.
error.processing.domainError=Værdien er uden for det tilladte domæne for denne operation.
error.processing.internal=Udtrykket kunne ikke behandles.
error.syntax.trailingOperator=Udtrykket slutter med operatoren '{operator}', men mangler dens højre operand.
error.syntax.missingOperand=Operatoren eller funktionen '{operator}' mangler en operand.
error.syntax.emptyFunctionArgument=Funktionen '{function}' blev kaldt uden argument.
error.syntax.leadingOperator=Udtrykket starter med operatoren '{operator}', men mangler dens venstre operand.
error.syntax.emptyParentheses=Tomt parentespar '()' uden indhold.
error.syntax.missingOperator=To operander er ikke forbundet af en operator.
error.syntax.unexpectedEnd=Udtrykket er ufuldstændigt: operander uden en forbindende operator.
error.argument.countMismatch=Funktionen '{function}' forventer {expected} argumenter, men modtog {actual}.
error.math.factorialNegative=Fakultet er ikke defineret for negative tal.
error.math.factorialNonInteger=Fakultet er kun defineret for heltal.
error.math.logNonPositive=Logaritmen er ikke defineret for ikke-positive argumenter.
error.math.rootOfNegative=Den lige rod af et negativt tal er ikke et reelt tal.
error.math.overflow=Resultatet er for stort til at beregne.
error.category.syntax=Syntaksfejl
error.category.math=Matematisk fejl
error.category.argument=Argumentfejl
error.category.stack=Stakfejl
error.category.range=Områdefejl
error.category.dimension=Dimensionsfejl
