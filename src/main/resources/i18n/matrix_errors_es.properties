matrix.error.invalidDimensions=Las dimensiones de la matriz deben ser enteros no negativos.
matrix.error.tooLarge=El tamaño de la matriz debe ser menor que Integer.MAX_VALUE.
matrix.error.stringEmpty=La cadena de la matriz no debe estar vacía.
matrix.error.stringEdgeSeparator=Las entradas de la matriz no deben empezar ni terminar con ';' o ','.
matrix.error.columnCountMismatch=Todas las filas deben tener el mismo número de columnas (se obtuvo {actual}, se esperaba {expected}).
matrix.error.entryEmpty=Una entrada de la matriz no debe estar vacía.
matrix.error.invalidEntry=Entrada de matriz no válida '{entry}' para la configuración regional {locale}.
matrix.error.dataEmpty=Los datos de la matriz deben contener al menos una fila.
matrix.error.rowEmpty=Las filas de la matriz deben contener al menos una columna.
matrix.error.raggedRow=Todas las filas deben tener el mismo número de columnas (la fila {row} tiene {actual} entradas, se esperaba {expected}).
matrix.error.rowIndexOutOfBounds=índice de fila fuera de los límites: {index}
matrix.error.columnIndexOutOfBounds=índice de columna fuera de los límites: {index}
matrix.error.notSquareDeterminant=El determinante solo está definido para matrices cuadradas.
matrix.error.notSquareInverse=Solo se pueden invertir las matrices cuadradas.
matrix.error.notSquarePower=La potencia de una matriz solo está definida para matrices cuadradas.
matrix.error.notSquareTrace=La traza solo está definida para matrices cuadradas.
matrix.error.multiplyDimMismatch=Incompatibilidad de dimensiones en la multiplicación de matrices: la matriz izquierda es {leftRows}x{leftCols}, la matriz derecha es {rightRows}x{rightCols}. Las columnas de la izquierda deben coincidir con las filas de la derecha.
matrix.error.elementWiseDimMismatch=Incompatibilidad de dimensiones en la operación elemento a elemento: la matriz izquierda es {leftRows}x{leftCols}, la matriz derecha es {rightRows}x{rightCols}. Ambas matrices deben tener dimensiones idénticas.
matrix.error.zeroDim=Las dimensiones de la matriz deben ser mayores que cero.
matrix.error.singular=La matriz no es invertible (el determinante es cero).
matrix.error.invalidExponent=El exponente de la matriz debe ser un entero no negativo.
