matrix.error.invalidDimensions=Matrix dimensions must be non-negative integers.
matrix.error.tooLarge=Matrix size must be smaller than Integer.MAX_VALUE.
matrix.error.stringEmpty=Matrix string must not be empty.
matrix.error.stringEdgeSeparator=Matrix entries must not start or end with ';' or ','.
matrix.error.columnCountMismatch=All rows must have same column count (got {actual}, expected {expected}).
matrix.error.entryEmpty=Matrix entry must not be empty.
matrix.error.invalidEntry=Invalid matrix entry '{entry}' for locale {locale}.
matrix.error.dataEmpty=Matrix data must contain at least one row.
matrix.error.rowEmpty=Matrix rows must contain at least one column.
matrix.error.raggedRow=All rows must have same column count (row {row} has {actual} entries, expected {expected}).
matrix.error.rowIndexOutOfBounds=row index out of bounds: {index}
matrix.error.columnIndexOutOfBounds=column index out of bounds: {index}
matrix.error.notSquareDeterminant=Determinant is only defined for square matrices.
matrix.error.notSquareInverse=Only square matrices can be inverted.
matrix.error.notSquarePower=Matrix power only defined for square matrices.
matrix.error.notSquareTrace=Trace only defined for square matrices.
matrix.error.multiplyDimMismatch=Matrix multiplication dimension mismatch: left matrix is {leftRows}x{leftCols}, right matrix is {rightRows}x{rightCols}. Left columns must equal right rows.
matrix.error.elementWiseDimMismatch=Element-wise matrix operation dimension mismatch: left matrix is {leftRows}x{leftCols}, right matrix is {rightRows}x{rightCols}. Both matrices must have identical dimensions.
matrix.error.zeroDim=Matrix dimensions must be greater than zero.
matrix.error.singular=Matrix is not invertible (determinant is zero).
matrix.error.invalidExponent=Matrix exponent must be a non-negative integer.
