error.syntax.invalidCharacter=Carattere non valido '{character}' alla posizione {position}.
error.syntax.missingRightParen=Parentesi di chiusura mancante per la funzione '{function}'.
error.syntax.unmatchedParen=Parentesi non bilanciate nell'espressione.
error.syntax.unknownFunction=Funzione o operatore sconosciuto '{function}'.
error.syntax.unknownVariable=La variabile '{variable}' non è definita.
error.syntax.incompleteExpression=L'espressione è incompleta o le barre di valore assoluto non sono bilanciate.
error.syntax.wrongArgumentCount=La funzione '{function}' richiede {expected} argomenti.
error.syntax.misplacedSeparator=Separatore ';' fuori posto nell'espressione.
error.syntax.invalidFactorial=Il fattoriale '!' deve seguire un numero, una costante, una variabile o una parentesi di chiusura.
error.processing.divisionByZero=La divisione per zero non è consentita.
error.processing.domainError=Il valore è al di fuori del dominio consentito per questa operazione.
error.processing.internal=Non è stato possibile elaborare l'espressione.
error.syntax.trailingOperator=L'espressione termina con l'operatore '{operator}' ma manca il suo operando destro.
error.syntax.missingOperand=All'operatore o alla funzione '{operator}' manca un operando.
error.syntax.emptyFunctionArgument=La funzione '{function}' è stata chiamata senza argomenti.
error.syntax.leadingOperator=L'espressione inizia con l'operatore '{operator}' ma manca il suo operando sinistro.
error.syntax.emptyParentheses=Coppia di parentesi vuota '()' senza contenuto.
error.syntax.missingOperator=Due operandi non sono collegati da un operatore.
error.syntax.unexpectedEnd=L'espressione è incompleta: operandi senza un operatore di collegamento.
error.argument.countMismatch=La funzione '{function}' richiede {expected} argomenti ma ne ha ricevuti {actual}.
error.math.factorialNegative=Il fattoriale non è definito per i numeri negativi.
error.math.factorialNonInteger=Il fattoriale è definito solo per i numeri interi.
error.math.logNonPositive=Il logaritmo non è definito per argomenti non positivi.
error.math.rootOfNegative=La radice pari di un numero negativo non è un numero reale.
error.math.overflow=Il risultato è troppo grande per essere calcolato.
error.category.syntax=Errore di sintassi
error.category.math=Errore matematico
error.category.argument=Errore di argomento
error.category.stack=Errore di stack
error.category.range=Errore di intervallo
error.category.dimension=Errore di dimensione
error.category.internal=Non è stato possibile elaborare l'espressione.
error.generic=Non è stato possibile valutare l'espressione.
